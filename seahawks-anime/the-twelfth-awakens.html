<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Twelfth Awakens</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;background:#000}
#hud{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:10px;opacity:0;transition:opacity .4s}
body:hover #hud{opacity:1}
#hud button{background:rgba(20,24,40,.7);color:#e9dcc0;border:1px solid rgba(233,220,192,.35);padding:7px 16px;font:12px Georgia,serif;letter-spacing:.18em;cursor:pointer;border-radius:2px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#cdbf9f;letter-spacing:.35em;font-size:12px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="load">PAINTING BACKGROUNDS…</div>
<div id="hud"><button id="play">PAUSE</button><button id="replay">REPLAY</button></div>
<script>
(()=>{
"use strict";
const W=1280,H=720,TAU=Math.PI*2,PI=Math.PI;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(x,a,b)=>x<a?a:x>b?b:x;
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const eIO=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eOut=(t,p=2)=>1-Math.pow(1-clamp(t,0,1),p);
const eIn=(t,p=2)=>Math.pow(clamp(t,0,1),p);
function hx(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const jit=(c,R,k)=>[c[0]+(R()-.5)*k,c[1]+(R()-.5)*k,c[2]+(R()-.5)*k];
function grad(st){st=st.map(s=>[s[0],hx(s[1])]);return t=>{t=clamp(t,0,1);for(let i=1;i<st.length;i++)if(t<=st[i][0]){const a=st[i-1],b=st[i];return mix(a[1],b[1],(t-a[0])/(b[0]-a[0]))}return st[st.length-1][1]}}

// ---------- path helpers
function poly(g,p,dx=0,dy=0){g.moveTo(p[0][0]+dx,p[0][1]+dy);for(let i=1;i<p.length;i++)g.lineTo(p[i][0]+dx,p[i][1]+dy);g.closePath()}
function addSmooth(g,p){const n=p.length;let a=p[n-1],b=p[0];g.moveTo((a[0]+b[0])/2,(a[1]+b[1])/2);for(let i=0;i<n;i++){const q=p[i],r=p[(i+1)%n];g.quadraticCurveTo(q[0],q[1],(q[0]+r[0])/2,(q[1]+r[1])/2)}g.closePath()}
function blobPts(x,y,rx,ry,rot,R,n=8,j=.22){const c=Math.cos(rot),s=Math.sin(rot),o=R()*TAU,p=[];for(let i=0;i<n;i++){const a=o+i/n*TAU,k=1+(R()*2-1)*j,px=Math.cos(a)*rx*k,py=Math.sin(a)*ry*k;p.push([x+px*c-py*s,y+px*s+py*c])}return p}
function dab(g,x,y,rx,ry,rot,col,a,R,n=8,j=.24){g.beginPath();addSmooth(g,blobPts(x,y,rx,ry,rot,R,n,j));g.globalAlpha=a;g.fillStyle=col;g.fill();g.globalAlpha=1}
function sArea(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1]}return s}
function softBlur(src,px){const out=mk(src.width,src.height),o=out.getContext('2d');
  if('filter' in o){o.filter=`blur(${px}px)`;o.drawImage(src,0,0);o.filter='none';
    // test that filter worked: if not, fall back
    return out}
  const f=Math.max(2,px/1.5),sm=mk(Math.ceil(src.width/f),Math.ceil(src.height/f)),s=sm.getContext('2d');s.imageSmoothingQuality='high';s.drawImage(src,0,0,sm.width,sm.height);o.imageSmoothingQuality='high';o.drawImage(sm,0,0,out.width,out.height);return out}

// =====================================================================
//  PAINTED BACKGROUND BRUSHES (gouache: no outlines, layered dabs)
// =====================================================================
function cloud(g,x,y,w,h,R,C){
  const n=Math.max(3,Math.round(w/(h*.95))),puffs=[];
  for(let i=0;i<n;i++){const t=n>1?i/(n-1):.5,b=Math.sin(t*PI),r=h*(.42+.55*b)*(.8+R()*.4);puffs.push([x+(t-.5)*w*.9+(R()-.5)*h*.3,y-r*.42-b*h*.2,r])}
  for(let i=0;i<n*.5;i++){const p=puffs[Math.floor(R()*n)];puffs.push([p[0]+(R()-.5)*p[2]*.9,p[1]-p[2]*.42,p[2]*(.5+R()*.25)])}
  const sh=puffs.map(p=>blobPts(p[0],p[1],p[2],p[2]*.86,0,R,12,.06));
  const shift=(k,dx,dy)=>{g.beginPath();sh.forEach((b,i)=>{const p=puffs[i];addSmooth(g,b.map(q=>[p[0]+(q[0]-p[0])*k+p[2]*dx,p[1]+(q[1]-p[1])*k+p[2]*dy]))})};
  g.save();g.beginPath();g.rect(x-w,y-h*4,w*2,h*4+1);g.clip();
  shift(1,0,0);g.fillStyle=C.sh;g.fill();
  g.save();shift(1,0,0);g.clip();
  shift(.96,.12*C.dir,.1);g.fillStyle=C.mid;g.fill();
  shift(.86,.3*C.dir,.24);g.fillStyle=C.lit;g.fill();
  for(let i=0;i<w/18;i++){const p=puffs[Math.floor(R()*puffs.length)];dab(g,p[0]+(R()-.5)*p[2]*1.4,p[1]+(R()-.3)*p[2],p[2]*(.3+R()*.4),2+R()*3,(R()-.5)*.2,R()<.5?C.sh:C.mid,.22,R,7,.3)}
  g.restore();g.restore();
}
function streakCloud(g,x,y,w,R,c1,c2){for(let i=0;i<6;i++){const xx=x+(R()-.5)*w*.6,yy=y+(R()-.5)*14;dab(g,xx,yy,w*(.2+R()*.3),2+R()*3.5,(R()-.5)*.05,c1,.55,R,10,.15);dab(g,xx+6,yy+2,w*(.12+R()*.2),1.2+R()*1.8,(R()-.5)*.05,c2,.65,R,10,.15)}}
function fir(g,x,base,h,R,C,lean=0){
  const tiers=Math.max(6,Math.round(h/12)),st=h*.95/tiers,Rt=[],Lt=[],T=[];
  for(let k=0;k<tiers;k++){const t=(k+1)/tiers,y=base-h+t*h*.95,w=h*(.035+.22*Math.pow(t,.85))*(.78+R()*.44)+2,cx=x+lean*(1-t)*h;T.push([cx,y,w,t]);
    Rt.push([cx+w*(.25+R()*.2),y-st*.55],[cx+w*(.75+R()*.1),y-st*.05+w*.05],[cx+w,y+w*.16+R()*2]);
    Lt.push([cx-w*(.25+R()*.2),y-st*.55],[cx-w*(.75+R()*.1),y-st*.05+w*.05],[cx-w*(.95+R()*.1),y+w*.16+R()*2])}
  const pts=[[x+lean*h,base-h-h*.04],...Rt,[x+h*.02,base],[x-h*.02,base],...Lt.reverse()];
  g.beginPath();addSmooth(g,pts);g.fillStyle=C.dk;g.fill();
  g.save();g.beginPath();addSmooth(g,pts);g.clip();
  for(const[cx,y,w,t]of T){
    // cool mid-tone on the shadow side to give the mass some form
    if(R()<.7)dab(g,cx-w*(.35+R()*.3),y-st*.1,w*.3,st*.2+1,.25,rgb(jit(mix(hx(C.dk),C.md,.35),R,8)),.9,R,7,.3);
    // sunlit branch tiers on the right
    const nd=1+Math.floor(R()*2.2);for(let i=0;i<nd;i++){const f=.35+R()*.55;dab(g,cx+w*f,y-st*.25+w*f*.1,w*(.18+R()*.16),st*.16+1,.28,rgb(jit(C.md,R,14)),.95,R,7,.3)}
    if(R()<.8){const f=.72+R()*.3;dab(g,cx+w*f,y-st*.35+w*.06,w*(.1+R()*.08)+.6,st*.08+.6,.32,rgb(jit(C.lt,R,18)),.95,R,6,.28)}
  }
  g.restore();
}
function spray(g,R,x0,y0,ang,len,C,lit=.5){
  const ca=Math.cos(ang),sa=Math.sin(ang),n=Math.ceil(len/16);
  g.strokeStyle=C.dk;g.lineCap='round';g.lineWidth=len*.022+2;g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(x0+ca*len*.5,y0+sa*len*.5+len*.08,x0+ca*len,y0+sa*len+len*.2);g.stroke();
  for(let i=0;i<n;i++){const t=(i+.5)/n,px=x0+ca*len*t,py=y0+sa*len*t+len*.2*t*t,fl=len*(.16+.1*(1-t))*(0.8+R()*.4);
    for(let j=0;j<5;j++){const a=ang+PI/2+(j-2)*.32+(R()-.5)*.2;dab(g,px+Math.cos(a)*fl*.5,py+Math.sin(a)*fl*.5,fl*.5,fl*.07+1.2,a,C.dk,1,R,6,.2)}
    if(R()<lit)dab(g,px+ca*fl*.2,py+fl*.5,fl*.32,fl*.045+.8,ang+PI/2-.3,R()<.5?C.lt:C.lt2||C.lt,.9,R,6,.2)}
}
function broadleaf(g,x,base,h,R,C){
  g.fillStyle=C.dk;g.beginPath();g.moveTo(x-h*.03,base);g.quadraticCurveTo(x+h*.02,base-h*.4,x,base-h*.6);g.lineTo(x+h*.03,base);g.fill();
  const cl=[];for(let i=0;i<9;i++){const a=R()*TAU,r=R();cl.push([x+Math.cos(a)*h*.3*r,base-h*.62+Math.sin(a)*h*.24*r,h*(.12+R()*.1)])}
  cl.sort((a,b)=>a[1]-b[1]);
  for(const c of cl)dab(g,c[0],c[1],c[2],c[2]*.85,0,C.dk,1,R,9,.2);
  for(const c of cl)dab(g,c[0]+c[2]*.22,c[1]-c[2]*.18,c[2]*.7,c[2]*.58,0,rgb(jit(C.md,R,12)),1,R,9,.2);
  for(const c of cl)if(R()<.7)dab(g,c[0]+c[2]*.5,c[1]-c[2]*.42,c[2]*.42,c[2]*.12,-.5,rgb(jit(C.lt,R,16)),.9,R,8,.3);
}
function fern(g,x,y,sz,R,col,lit,bend=0,spread=1){
  const n=6+Math.floor(R()*4);
  for(let i=0;i<n;i++){const s=i/(n-1)-.5;let a=-PI/2+s*2.3*spread+(R()-.5)*.25+bend*.6;const len=sz*(.65+R()*.45),droop=.7+R()*.5;let px=x,py=y;const st=11;
    for(let k=0;k<st;k++){const t=k/st;a+=(s<0?-1:1)*droop*.11+bend*.05*t;const nx=px+Math.cos(a)*len/st,ny=py+Math.sin(a)*len/st,lw=sz*.085*(1-t*.85)+.5;
      for(const sg of[-1,1]){const aa=a+sg*1.15,lx=nx+Math.cos(aa)*lw*1.7,ly=ny+Math.sin(aa)*lw*1.7;dab(g,(nx+lx)/2,(ny+ly)/2,lw*1.15,lw*.45,aa,(lit&&sg<0===(s<0)&&R()<.7)?lit:col,1,R,6,.2)}
      px=nx;py=ny}}
}
function grassTuft(g,x,y,h,R,col,lit,bend=0){
  const n=5+Math.floor(R()*6);
  for(let i=0;i<n;i++){const a=(R()-.5)*.9+bend,hh=h*(.5+R()*.6),w=h*.05+.6,tx=x+Math.sin(a)*hh,ty=y-Math.cos(a)*hh,cx=x+Math.sin(a*.4)*hh*.5+bend*hh*.3,cy=y-hh*.55;
    g.beginPath();g.moveTo(x-w,y);g.quadraticCurveTo(cx-w*.5,cy,tx,ty);g.quadraticCurveTo(cx+w*.5,cy,x+w,y);g.fillStyle=(R()<.35&&lit)?lit:col;g.fill()}
}
function mistBand(g,x0,x1,y,h,col,a,R,n){
  for(let i=0;i<n;i++){const x=lerp(x0,x1,R()),yy=y+(R()-.5)*h,rx=40+R()*160,ry=8+R()*h*.35;
    const gr=g.createRadialGradient(x,yy,0,x,yy,rx);gr.addColorStop(0,rgb(col,a));gr.addColorStop(1,rgb(col,0));
    g.save();g.translate(x,yy);g.scale(1,ry/rx);g.translate(-x,-yy);g.fillStyle=gr;g.beginPath();g.arc(x,yy,rx,0,TAU);g.fill();g.restore()}
}

// =====================================================================
//  PRE-RENDERED BACKGROUND PAINTINGS
// =====================================================================
const BW=1480,BH=800;
let L0,L1,L2,L3,L4a,L4b,LBG,LFG,SKY,CB,CBL,BOKEH,GRAIN,VIG,MIST=[],TREES=[];
const SKYG=grad([[0,'#3b4b84'],[.22,'#62679e'],[.42,'#b58fae'],[.56,'#eeae94'],[.68,'#ffcf98'],[.8,'#ffe2ad'],[1,'#fff0c9']]);
function paintSky(g,w,h,sun,G,R){
  for(let y=0;y<h;y+=2){g.fillStyle=rgb(G(y/h));g.fillRect(0,y,w,2)}
  for(let i=0;i<w*h/380;i++){const x=R()*w,y=R()*h;dab(g,x,y,18+R()*50,3+R()*7,(R()-.5)*.12,rgb(jit(G(y/h),R,12)),.32,R,7,.3)}
  let gr=g.createRadialGradient(sun[0],sun[1],0,sun[0],sun[1],sun[2]);gr.addColorStop(0,'rgba(255,250,228,1)');gr.addColorStop(.08,'rgba(255,240,200,.9)');gr.addColorStop(.35,'rgba(255,214,150,.35)');gr.addColorStop(1,'rgba(255,200,140,0)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
}
function prerender(){
  let R,g;
  // ---------------- L0 sky (wide)
  L0=mk(BW,BH);g=L0.getContext('2d');R=rng(11);
  paintSky(g,BW,BH,[1170,520,620],SKYG,R);
  for(let i=0;i<16;i++){const x=R()*BW,y=50+R()*240;streakCloud(g,x,y,180+R()*260,R,'#c495ab','#ffd2b0')}
  [[230,410,520,95],[640,360,380,70],[880,445,300,55],[60,300,300,60],[1320,330,260,52]].forEach(c=>cloud(g,c[0],c[1],c[2],c[3],R,{sh:'#a98bad',mid:'#f0b29a',lit:'#ffe0b6',dir:1}));
  g.globalCompositeOperation='lighter';let gr=g.createRadialGradient(1170,520,0,1170,520,140);gr.addColorStop(0,'rgba(255,240,200,.55)');gr.addColorStop(1,'rgba(255,200,120,0)');g.fillStyle=gr;g.fillRect(0,0,BW,BH);g.globalCompositeOperation='source-over';

  // ---------------- L1 Mount Rainier + foothills
  L1=mk(BW,BH);g=L1.getContext('2d');R=rng(21);
  const mx=520,mtop=380,mbase=600,mhw=420,prof=[];
  for(let x=mx-mhw;x<=mx+mhw;x+=6){const d=Math.abs(x-mx)/mhw;let hh=(mbase-mtop)*Math.pow(1-d,1.35);hh+=Math.sin(x*.03)*3+Math.sin(x*.011+1)*7*(1-d);if(Math.abs(x-mx)<26)hh=(mbase-mtop)-Math.abs(x-mx)*.25;prof.push([x,mbase-hh])}
  prof.push([mx+mhw,mbase+40],[mx-mhw,mbase+40]);
  g.save();g.beginPath();poly(g,prof);g.clip();
  g.fillStyle='#a593bd';g.fillRect(0,0,BW,BH);
  // lit (sun) side
  g.beginPath();g.moveTo(mx-4,mtop-5);for(let y=mtop;y<mbase+40;y+=8)g.lineTo(mx+(y-mtop)*.2+Math.sin(y*.09)*8,y);g.lineTo(BW,mbase+40);g.lineTo(BW,0);g.closePath();g.fillStyle='#e7b7ad';g.fill();
  // snow
  g.save();g.beginPath();for(let x=mx-mhw;x<=mx+mhw;x+=10)g.lineTo(x,mtop+70+Math.abs(x-mx)*.25+Math.sin(x*.07)*14+Math.sin(x*.21)*6);g.lineTo(mx+mhw,0);g.lineTo(mx-mhw,0);g.closePath();g.clip();
  g.fillStyle='#c7b9da';g.fillRect(0,0,BW,BH);
  g.beginPath();g.moveTo(mx-4,mtop-5);for(let y=mtop;y<mbase;y+=8)g.lineTo(mx+(y-mtop)*.2+Math.sin(y*.09)*8,y);g.lineTo(BW,mbase);g.lineTo(BW,0);g.closePath();g.fillStyle='#ffeedd';g.fill();
  for(let i=0;i<160;i++){const x=mx+(R()-.5)*mhw*1.3,y=mtop+20+R()*150;dab(g,x,y,1.5+R()*2.5,8+R()*16,(x-mx)*.004,x>mx?'#f2c9bd':'#ad9fcb',.6,R,6,.3)}
  g.restore();
  for(let i=0;i<500;i++){const x=mx+(R()-.5)*mhw*2,y=mtop+R()*230;dab(g,x,y,2+R()*6,1+R()*3,(R()-.5)*.6,x>mx+(y-mtop)*.2?'#f3c4b4':'#998ab7',.35,R,6,.3)}
  gr=g.createLinearGradient(0,mbase-130,0,mbase+20);gr.addColorStop(0,'rgba(247,206,178,0)');gr.addColorStop(1,'rgba(247,206,178,.85)');g.fillStyle=gr;g.fillRect(0,0,BW,BH);
  g.restore();
  // foothill ridges
  [[575,'#a28fba','#e8b39f',22],[600,'#8e83b2','#dca595',26],[625,'#7d78a9','#cf9a8e',30]].forEach((r,k)=>{
    g.beginPath();g.moveTo(0,BH);for(let x=0;x<=BW;x+=8)g.lineTo(x,r[0]-r[3]*(.5+.5*Math.sin(x*.006+k*2))-Math.sin(x*.023+k)*6);g.lineTo(BW,BH);g.closePath();g.fillStyle=r[1];g.fill();
    for(let x=0;x<BW;x+=5)if(R()<.5)dab(g,x,r[0]-r[3]*(.5+.5*Math.sin(x*.006+k*2))-Math.sin(x*.023+k)*6+3,4+R()*7,1.5+R()*2,0,r[2],.55,R,6,.3)});
  mistBand(g,0,BW,612,70,[255,226,196],.5,R,60);

  // ---------------- L2 far forest
  L2=mk(BW,BH);g=L2.getContext('2d');R=rng(31);
  const C2={dk:'#6c6a99',md:[134,124,165],lt:[236,184,152]};
  firRowPaint(g,R,170,-20,BW+20,628,40,95,C2,null);
  const C2b={dk:'#5c5f8f',md:[112,110,154],lt:[230,170,140]};
  firRowPaint(g,R,110,-20,BW+20,652,60,130,C2b,null);
  g.fillStyle='#5c5f8f';g.fillRect(0,662,BW,BH-662);
  mistBand(g,0,BW,650,60,[255,232,205],.55,R,90);
  gr=g.createLinearGradient(0,600,0,720);gr.addColorStop(0,'rgba(255,226,196,0)');gr.addColorStop(1,'rgba(255,226,196,.75)');g.fillStyle=gr;g.fillRect(0,560,BW,240);

  // ---------------- L3 mid forest + clearing
  L3=mk(BW,BH);g=L3.getContext('2d');R=rng(41);
  // far trees inside the clearing gap, lighter (atmosphere)
  const C3f={dk:'#4d5677',md:[94,104,130],lt:[226,168,120],rim:'#ffd79c'};
  firRowPaint(g,R,24,450,1040,690,110,190,C3f,null);
  broadleaf(g,560,700,120,R,{dk:'#4c5a66',md:[96,112,104],lt:[220,190,120]});
  broadleaf(g,975,700,135,R,{dk:'#4c5a66',md:[96,112,104],lt:[222,192,120]});
  // meadow
  g.beginPath();g.moveTo(0,BH);g.lineTo(0,700);for(let x=0;x<=BW;x+=10)g.lineTo(x,698+Math.sin(x*.013)*5+Math.sin(x*.05)*2);g.lineTo(BW,BH);g.closePath();g.fillStyle='#55634a';g.fill();
  for(let i=0;i<1600;i++){const x=R()*BW,y=700+Math.pow(R(),.8)*100,c=Math.abs(x-800)<330&&R()<.6;dab(g,x,y,4+R()*12,1.5+R()*3,(R()-.5)*.2,c?rgb(jit([196,176,104],R,26)):rgb(jit([70,84,64],R,20)),.6,R,6,.3)}

function drawLeaf(g,x,y,sz,rot,flip,front,back,ink){
  g.save();g.translate(x,y);g.rotate(rot);g.scale(Math.cos(flip)||.05,1);
  const f=Math.cos(flip)>0;g.beginPath();g.moveTo(0,-sz);g.quadraticCurveTo(sz*.62,-sz*.2,0,sz);g.quadraticCurveTo(-sz*.62,-sz*.2,0,-sz);g.fillStyle=f?front:back;g.fill();
  g.beginPath();g.moveTo(0,-sz);g.quadraticCurveTo(sz*.62,-sz*.2,0,sz);g.lineTo(0,-sz);g.fillStyle='rgba(60,50,110,.28)';g.fill();
  if(ink){g.strokeStyle=INK;g.lineWidth=Math.max(.6,sz*.09)/Math.max(.2,Math.abs(Math.cos(flip)));g.beginPath();g.moveTo(0,-sz);g.quadraticCurveTo(sz*.62,-sz*.2,0,sz);g.quadraticCurveTo(-sz*.62,-sz*.2,0,-sz);g.stroke()}
  g.restore();
}
const LEAFC=[['#9db84a','#6f8a3a'],['#e2b24a','#b0832e'],['#c9d36a','#8da044'],['#e48b3e','#a8602a'],['#7fa64a','#557a36']];
function newLeaf(R,x,y,vx,vy,sz){const c=LEAFC[Math.floor(R()*LEAFC.length)];return{k:'leaf',x,y,vx,vy,sz,rot:R()*TAU,spin:(R()-.5)*5,flip:R()*TAU,fv:2+R()*5,ph:R()*TAU,pw:1.2+R()*1.6,amp:20+R()*50,c,life:0}}
function stepLeaf(p,dt,wind=0,grav=34){p.life+=dt;p.ph+=p.pw*dt;p.flip+=p.fv*dt;p.rot+=p.spin*dt;p.vx+=(wind-p.vx)*1.2*dt;p.vy+=(grav-p.vy)*1.4*dt;p.x+=(p.vx+Math.cos(p.ph)*p.amp)*dt;p.y+=(p.vy+Math.sin(p.ph*2)*p.amp*.25)*dt}
function drawBirdSmall(g,x,y,s,ph,dir,col){
  const fr=Math.floor(ph)%4,wa=[-1.1,-.3,.55,-.3][fr];g.save();g.translate(x,y);g.scale(s*dir,s);g.fillStyle=col||'#2a2534';
  g.beginPath();g.ellipse(0,0,4,1.4,-.1,0,TAU);g.fill();g.beginPath();g.moveTo(-3.6,-.5);g.lineTo(-5.4,-.9);g.lineTo(-3.8,.5);g.fill();
  g.beginPath();g.moveTo(-1,0);g.quadraticCurveTo(0,Math.sin(wa)*6-2,2.5,Math.sin(wa)*8);g.lineTo(1.2,0);g.fill();
  g.beginPath();g.moveTo(3.5,0);g.lineTo(6,-1);g.lineTo(5.8,1);g.fill();g.restore();
}
// The perched osprey (detailed, cel shaded)
function drawOsprey(g,x,y,s,state,L){
  // state: {wing:0 folded,1 up,2 mid,3 down, look:±1, squash}
  g.save();g.translate(x,y);g.scale(s*(state.dir||1),s*(1-(state.sq||0)));
  const iw=clamp(s*.5,1,2.6)/s,Lb=[L[0]*(state.dir||1),L[1]];
  const wing=state.wing||0;
  const wingPts=[null,[[0,-2],[4,-12],[9,-15],[7,-9],[2,-1]],[[0,-2],[6,-6],[11,-6],[8,-2],[2,0]],[[0,-2],[5,2],[10,6],[6,4],[2,1]]];
  if(wing>0){g.save();g.scale(1,1);celShape(g,wingPts[wing].map(q=>[q[0]-1,q[1]]),'#4a3a30',Lb,iw,{sh:1,hi:.4,far:1,seed:91});g.restore()}
  const body=[[-4,-3.4],[0,-4.2],[4.6,-2.2],[8.6,.6],[9,1.6],[3.6,2.6],[-2.6,2.6],[-4.8,.4]];
  celShape(g,body,'#efe6d4',Lb,iw,{sh:1.1,hi:.5,seed:92,decal:()=>{g.fillStyle='#5a4535';g.beginPath();poly(g,[[-1,-4.4],[4.6,-2.4],[9.2,.8],[6,1],[1,-.5],[-2,-2]]);g.fill()}});
  const lk=state.look||0;
  g.save();g.translate(-3.8,-3.6);g.rotate(lk*.25);
  const head=[[-2.6,-2.2],[.4,-3.2],[2.6,-1.4],[2.2,1.2],[-1.6,1.6],[-3,0]];
  celShape(g,head,'#f4efe4',Lb,iw,{sh:.9,hi:.4,seed:93,decal:()=>{g.fillStyle='#4a3a30';g.beginPath();poly(g,[[-2.2,-.6],[1,-.9],[2.8,.4],[2.4,1.2],[0,.2],[-2.2,.2]]);g.fill()}});
  g.fillStyle='#2b2124';g.beginPath();poly(g,[[-2.6,-1.2],[-4.4,-.4],[-3.8,.3],[-2.6,.1]]);g.fill();
  g.fillStyle='#f6d24a';g.beginPath();g.arc(-1.2,-.9,.55,0,TAU);g.fill();g.fillStyle='#101010';g.beginPath();g.arc(-1.3,-.9,.3,0,TAU);g.fill();
  g.restore();
  if(wing===0){celShape(g,[[-.5,-2.6],[5,-2],[9.6,1],[5,1.8],[0,.6]],'#5a4535',Lb,iw,{sh:.8,hi:.5,seed:94,post:()=>{pl(g,[[2,-.6],[7,.8]],iw*.4)}})}
  else celShape(g,wingPts[wing].map(q=>[q[0]+.5,q[1]+.2]),'#5c4838',Lb,iw,{sh:1,hi:.5,seed:95,post:()=>pl(g,[[1,-1],[wingPts[wing][2][0]*.8,wingPts[wing][2][1]*.8]],iw*.4)});
  g.strokeStyle='#c9b48a';g.lineWidth=.7;g.beginPath();g.moveTo(0,2.4);g.lineTo(-.4,4.2);g.moveTo(2,2.4);g.lineTo(2.2,4.2);g.stroke();
  g.restore();
}
function dust(R,x,y,r0,r1,dur,cols){const n=6+Math.floor(R()*5),pf=[];for(let i=0;i<n;i++){const a=R()*TAU,d=R();pf.push([Math.cos(a)*d*.8,Math.sin(a)*d*.35-d*.2,.35+R()*.45,R()])}return{k:'dust',x,y,r0,r1,dur,life:0,pf,cols:cols||['#a698b4','#e8d3b0','#fff0d0'],vx:0,vy:0}}
function drawDust(g,p){const t=p.life/p.dur;if(t>=1)return;const r=lerp(p.r0,p.r1,eOut(t,3));
  for(let pass=0;pass<2;pass++){g.fillStyle=pass?p.cols[1]:p.cols[0];g.beginPath();for(const q of p.pf){const k=t<.55?1:1-(t-.55)/.45*(0.6+q[3]*.6);if(k<=0)continue;const rr=q[2]*r*k*(pass?.78:1);g.moveTo(p.x+q[0]*r+(pass?rr*.2:0)+rr,p.y+q[1]*r-(pass?rr*.22:0));g.arc(p.x+q[0]*r+(pass?rr*.2:0),p.y+q[1]*r-(pass?rr*.22:0),rr,0,TAU)}g.fill()}}
function drawFlame(g,x,y,dx,dy,len,wid,fi,seed){
  const k=.82+.36*hash(fi*3.17+seed),l=len*k,nx=-dy,ny=dx;
  const layer=(lf,wf,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(x+nx*wid*wf,y+ny*wid*wf);g.quadraticCurveTo(x+dx*l*lf*.45+nx*wid*wf*1.15,y+dy*l*lf*.45+ny*wid*wf*1.15,x+dx*l*lf,y+dy*l*lf);g.quadraticCurveTo(x+dx*l*lf*.45-nx*wid*wf*1.15,y+dy*l*lf*.45-ny*wid*wf*1.15,x-nx*wid*wf,y-ny*wid*wf);g.closePath();g.fill()};
  layer(1,1,'rgba(255,128,50,.92)');layer(.78,.72,'#ffc757');layer(.48,.42,'#fffbe6');
  g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x+dx*l*.3,y+dy*l*.3,0,x+dx*l*.3,y+dy*l*.3,l*.9);gr.addColorStop(0,'rgba(255,190,90,.55)');gr.addColorStop(1,'rgba(255,120,40,0)');g.fillStyle=gr;g.beginPath();g.arc(x+dx*l*.3,y+dy*l*.3,l*.9,0,TAU);g.fill();g.globalCompositeOperation='source-over';
}
function glow(g,x,y,r,col,a){g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgb(col,a));gr.addColorStop(.3,rgb(col,a*.35));gr.addColorStop(1,rgb(col,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.globalCompositeOperation='source-over'}
function flare(g,x,y,len,a){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(220,255,170,${a})`;g.beginPath();g.moveTo(x-len,y);g.lineTo(x,y-len*.02);g.lineTo(x+len,y);g.lineTo(x,y+len*.02);g.fill();g.beginPath();g.moveTo(x,y-len*.35);g.lineTo(x+len*.015,y);g.lineTo(x,y+len*.35);g.lineTo(x-len*.015,y);g.fill();glow(g,x,y,len*.25,[200,255,140],a*.8);g.globalCompositeOperation='source-over'}
function rays(g,list,a){g.save();g.globalCompositeOperation='screen';for(const r of list){const[x0,y0,x1,y1,w0,w1,al]=r;const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,`rgba(255,226,170,0)`);gr.addColorStop(.25,`rgba(255,226,170,${al*a})`);gr.addColorStop(1,`rgba(255,226,170,0)`);const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy),nx=-dy/l,ny=dx/l;g.fillStyle=gr;g.beginPath();g.moveTo(x0+nx*w0,y0+ny*w0);g.lineTo(x1+nx*w1,y1+ny*w1);g.lineTo(x1-nx*w1,y1-ny*w1);g.lineTo(x0-nx*w0,y0-ny*w0);g.fill()}g.restore()}
function bandPath(g,cx,cy,dx,dy,w,len){const l=Math.hypot(dx,dy);dx/=l;dy/=l;const nx=-dy,ny=dx;g.moveTo(cx-dx*len+nx*w,cy-dy*len+ny*w);g.lineTo(cx+dx*len+nx*w,cy+dy*len+ny*w);g.lineTo(cx+dx*len-nx*w,cy+dy*len-ny*w);g.lineTo(cx-dx*len-nx*w,cy-dy*len-ny*w);g.closePath()}
// lighting pass on the robot layer: shade everything outside the lit bands, haze for distance
function lightRobot(lit,shade,warm,haze){
  rg.setTransform(1,0,0,1,0,0);rg.globalCompositeOperation='source-atop';
  if(shade){rg.save();if(lit){rg.beginPath();rg.rect(0,0,W,H);lit(rg);rg.clip('evenodd')}rg.fillStyle=shade;rg.fillRect(0,0,W,H);rg.restore()}
  if(warm&&lit){rg.save();rg.beginPath();lit(rg);rg.clip();rg.fillStyle=warm;rg.fillRect(0,0,W,H);rg.restore()}
  if(haze){rg.fillStyle=haze;rg.fillRect(0,0,W,H)}
  rg.globalCompositeOperation='source-over';
}
// world-space ground plants around the robot's base
function groundPlants(g,cam,seed,bend){
  const R=rng(seed);g.save();g.setTransform(cam.s,0,0,cam.s,cam.ox,cam.oy);
  for(let i=0;i<34;i++){const x=-58+R()*110,y=1+R()*5,sz=6+R()*9,b=bend?bend(x):0;if(R()<.55)fern(g,x,y,sz,R,'#2c3b2c',R()<.6?'#88954a':'#d2b064',b);else grassTuft(g,x,y,sz*.9,R,'#34442f','#c7b26a',b*.6)}
  for(let i=0;i<40;i++){const x=-55+R()*105,y=2+R()*4;g.fillStyle=R()<.5?'#f6efe0':'#a993e4';g.beginPath();g.arc(x,y-R()*5,.45+R()*.4,0,TAU);g.fill()}
  g.restore();
}
// ---------- vines (verlet, world units, overlapping action)
const VDEF=[{p:'pa',lx:-11,ly:6,n:9},{p:'pa',lx:5,ly:7,n:6},{p:'faF',lx:-6.5,ly:16,n:6},{p:'to',lx:-15.5,ly:-12,n:8},{p:'to',lx:-4,ly:-31,n:7},{p:'thF',lx:-6,ly:22,n:4},{p:'hd',lx:-11,ly:-1,n:4},{p:'to',lx:20.5,ly:-14,n:7},{p:'faN',lx:-7,ly:12,n:5}];
function initVines(F){return VDEF.map(v=>{const a=toW(F[v.p],v.lx,v.ly),pts=[];for(let i=0;i<=v.n;i++)pts.push({x:a[0],y:a[1]+i*2.4,px:a[0],py:a[1]+i*2.4});return{v,pts}})}
function stepVines(V,F,dt){for(const vn of V){const a=toW(F[vn.v.p],vn.v.lx,vn.v.ly),P=vn.pts;P[0].x=a[0];P[0].y=a[1];
  for(let i=1;i<P.length;i++){const q=P[i],vx=(q.x-q.px)*.975,vy=(q.y-q.py)*.975;q.px=q.x;q.py=q.y;q.x+=vx;q.y+=vy+70*dt*dt;if(q.y>-.3)q.y=-.3}
  for(let it=0;it<6;it++)for(let i=1;i<P.length;i++){const a1=P[i-1],b=P[i],dx=b.x-a1.x,dy=b.y-a1.y,d=Math.hypot(dx,dy)||1,df=(d-2.4)/d;if(i===1){b.x-=dx*df;b.y-=dy*df}else{a1.x+=dx*df*.5;a1.y+=dy*df*.5;b.x-=dx*df*.5;b.y-=dy*df*.5}}}}
function drawVines(g,V,cam){const S=cam.s;for(const vn of V){const P=vn.pts.map(q=>[cam.ox+q.x*S,cam.oy+q.y*S]);
  g.strokeStyle='#22301f';g.lineWidth=Math.max(1.1,S*.42);g.lineCap='round';g.beginPath();g.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length-1;i++)g.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+P[i+1][0])/2,(P[i][1]+P[i+1][1])/2);g.lineTo(P[P.length-1][0],P[P.length-1][1]);g.stroke();
  for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],ang=Math.atan2(b[1]-a[1],b[0]-a[0])+(i%2?1:-1)*1.0,sz=S*1.25;
    g.save();g.translate(b[0],b[1]);g.rotate(ang);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(sz*.6,-sz*.55,sz*1.3,0);g.quadraticCurveTo(sz*.6,sz*.55,0,0);g.fillStyle=i%3?'#6f9440':'#a9b956';g.fill();
    g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(sz*.6,sz*.55,sz*1.3,0);g.lineTo(0,0);g.fillStyle='rgba(40,50,100,.35)';g.fill();
    if(S>4){g.strokeStyle=INK;g.lineWidth=Math.max(.7,S*.12);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(sz*.6,-sz*.55,sz*1.3,0);g.quadraticCurveTo(sz*.6,sz*.55,0,0);g.stroke()}g.restore()}}}
function drawClod(g,p,cam){const S=cam.s,x=cam.ox+p.x*S,y=cam.oy+p.y*S,r=p.r*S;g.save();g.translate(x,y);g.rotate(p.rot);
  g.beginPath();poly(g,p.shape.map(q=>[q[0]*r,q[1]*r]));g.fillStyle=p.c[0];g.fill();
  g.save();g.clip();g.beginPath();poly(g,p.shape.map(q=>[q[0]*r+r*.35,q[1]*r-r*.3]));g.fillStyle=p.c[1];g.fill();g.restore();
  if(r>3){g.strokeStyle=INK;g.lineWidth=Math.max(.8,r*.12);g.beginPath();poly(g,p.shape.map(q=>[q[0]*r,q[1]*r]));g.stroke()}g.restore()}
function newClod(R,x,y,vx,vy,r,type){const sh=[];const n=6;for(let i=0;i<n;i++){const a=i/n*TAU,k=.6+R()*.5;sh.push([Math.cos(a)*k,Math.sin(a)*k])}
  const c=type==='moss'?['#3c5a2f','#93ad48']:type==='rock'?['#57525e','#a29a96']:['#4b3a33','#8b6a4d'];return{k:'clod',x,y,vx,vy,r,rot:R()*TAU,vr:(R()-.5)*6,shape:sh,c,rest:0}}
function stepClod(p,dt){if(p.rest)return;p.vy+=70*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.y>-p.r*.5){p.y=-p.r*.5;if(Math.abs(p.vy)>8){p.vy*=-.3;p.vx*=.5;p.vr*=.5}else{p.rest=1}}}
function windRing(g,cx,cy,r,a,seed,thick){
  if(a<=0)return;g.save();g.globalCompositeOperation='screen';
  for(const k of[1,.9,.78,.62]){const rr=r*k,ry=rr*.2;for(let i=0;i<16;i++){const a0=i/16*TAU+hash(seed+i+k*7)*.4,al=.18+hash(seed*3+i+k)*.3;const n=10,pts=[];
      for(let j=0;j<=n;j++){const t=a0+al*j/n;pts.push([cx+Math.cos(t)*rr,cy+Math.sin(t)*ry])}
      const w=thick*(k===1?1:.55)*(.5+.5*Math.max(0,Math.sin(a0)))*(1+(rr>0?0:0));
      g.fillStyle=`rgba(255,244,214,${a*(k===1?.9:.5)})`;g.beginPath();
      for(let j=0;j<=n;j++){const s=Math.sin(j/n*PI)*w;g.lineTo(pts[j][0],pts[j][1]-s)}
      for(let j=n;j>=0;j--){const s=Math.sin(j/n*PI)*w*.3;g.lineTo(pts[j][0],pts[j][1]+s)}g.fill()}}
  g.restore();
}

function drawLayer(g,img,f,cam,cx=740,cy=400){g.setTransform(cam.sc,0,0,cam.sc,W/2-(cx+cam.px*f)*cam.sc+cam.sx,H/2-(cy+cam.py*f)*cam.sc+cam.sy);g.drawImage(img,0,0);g.setTransform(1,0,0,1,0,0)}
function l2s(lx,ly,f,cam){return[W/2+(lx-740-cam.px*f)*cam.sc+cam.sx,H/2+(ly-400-cam.py*f)*cam.sc+cam.sy]}
const WIDE_RAYS=[[1300,-60,560,900,30,120,.32],[1180,-60,440,900,18,70,.22],[1050,-60,300,900,14,60,.2],[1450,-60,700,900,26,110,.25],[1100,-60,820,700,8,40,.18]];
function wideRays(g,cam,a){const r=WIDE_RAYS.map(q=>{const p0=l2s(q[0],q[1],.7,cam),p1=l2s(q[2],q[3],.7,cam);return[p0[0],p0[1],p1[0],p1[1],q[4]*cam.sc,q[5]*cam.sc,q[6]]});rays(g,r,a)}
function drawMist(g,cam,u,f,y,a,push){for(let k=0;k<4;k++){const m=MIST[k],x=-200+k*430+((u*6*(k%2?1:-1))%60);let p=l2s(x,y+(k%2)*24,f,cam);const dx=push?push(p[0]+m.width*cam.sc/2):0;g.globalAlpha=a*(push?Math.max(0,1-Math.abs(dx)/260):1);g.drawImage(m,p[0]+dx,p[1],m.width*cam.sc,m.height*cam.sc)}g.globalAlpha=1}
function motes(g,R,n,u,box,beam){g.save();g.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const x0=box[0]+R()*(box[2]-box[0]),y0=box[1]+R()*(box[3]-box[1]),sp=4+R()*10,ph=R()*TAU;const x=x0+Math.sin(u*.4+ph)*14,y=y0+((u*sp)%60)-30;const tw=.5+.5*Math.sin(u*1.3+ph*3);if(beam&&!beam(x,y))continue;g.fillStyle=`rgba(255,236,190,${.35*tw})`;g.beginPath();g.arc(x,y,1+R()*1.2,0,TAU);g.fill()}g.restore()}

    for(const w of st.W){const a=u-w.t,rr=(w.r+a*22)*(.5+robScale(0)*.0+1),al=Math.max(0,.62-a*.07);if(al<=0)continue;const R=rng(w.sd|0),side=(R()-.5)*2,X=w.x-60+sx+side*(6+a*16),Y=w.y-camY+sy+a*5;const gr=g.createRadialGradient(X,Y,0,X,Y,rr);gr.addColorStop(0,`rgba(255,244,224,${al})`);gr.addColorStop(.6,`rgba(246,214,206,${al*.55})`);gr.addColorStop(1,'rgba(240,200,200,0)');g.fillStyle=gr;g.beginPath();g.arc(X,Y,rr,0,TAU);g.fill()}
    if(st.T.length>1){g.save();g.globalCompositeOperation='screen';const T=st.T;
      for(const[wid,col]of[[1,'rgba(255,214,140,.55)'],[.45,'rgba(255,250,232,.95)']]){g.fillStyle=col;g.beginPath();
        for(let i=0;i<T.length;i++){const q=T[i],q2=T[Math.min(T.length-1,i+1)],dx=q2[0]-q[0],dy=q2[1]-q[1],l=Math.hypot(dx,dy)||1,age=u-q[2],w=(4+age*7)*wid*clamp(1-age/7,0,1)*(i/T.length*.6+.4);g.lineTo(q[0]-60-dy/l*w+sx,q[1]-camY+dx/l*w+sy)}
        for(let i=T.length-1;i>=0;i--){const q=T[i],q2=T[Math.min(T.length-1,i+1)],dx=q2[0]-q[0],dy=q2[1]-q[1],l=Math.hypot(dx,dy)||1,age=u-q[2],w=(4+age*7)*wid*clamp(1-age/7,0,1)*(i/T.length*.6+.4);g.lineTo(q[0]-60+dy/l*w+sx,q[1]-camY-dx/l*w+sy)}
        g.fill()}g.restore()}
    // the robot
    const rs=robScale(f),x=p[0]-60+sx,y=p[1]-camY+sy;
    if(f<.985){
      const pose=u<L8?{...CROUCH}:{...FLY};
      const tilt=u<L8?0:Math.atan2(flyPath(Math.min(1,f+.01))[0]-p[0],-(flyPath(Math.min(1,f+.01))[1]-p[1]))*.8;
      const pz={...pose,ground:false,x:0,y:0};for(const k of['thF','shF','ftF','thN','shN','ftN','to','hd','uaF','faF','haF','uaN','faN','haN'])pz[k]+=tilt;
      rg.setTransform(1,0,0,1,0,0);rg.clearRect(0,0,W,H);const cam={s:rs,ox:x,oy:y};
      const F=drawRobot(rg,pz,cam,{eye:.95,core:1});lightRobot(null,'rgba(60,50,100,.18)',null,'rgba(255,220,180,'+(ss(.2,.9,f)*.5)+')');
      const fi=Math.floor(u*24),nz=toW(F.to,15.5,-1.5),d=[-Math.sin(F.to.r),Math.cos(F.to.r)],big=u<L8?.8:2.4;
            for(const k of['ftF','ftN']){const s=toW(F[k],6.5,5);drawFlame(g,x+s[0]*rs,y+s[1]*rs,d[0],d[1],40*rs/3.3*big,9*rs/3.3,fi,k==='ftF'?2:3)}
      drawFlame(g,x+nz[0]*rs,y+nz[1]*rs,d[0],d[1],60*rs/3.3*big,12*rs/3.3,fi,1);
      // smear frames at the moment of launch
      if(u>L8&&u<L8+.17){g.save();g.translate(x,y);g.scale(1,1.7);g.translate(-x,-y);g.drawImage(RC,0,0);g.restore();
        g.strokeStyle='rgba(255,246,220,.8)';for(let i=0;i<26;i++){const R=rng(i+fi*31),xx=x+(R()-.5)*260,len=200+R()*300;g.lineWidth=1+R()*3;g.beginPath();g.moveTo(xx,y+R()*120);g.lineTo(xx,y+len);g.stroke()}}
      else g.drawImage(RC,0,0);
      const e=toW(F.hd,-11.3,-8.4);glow(g,x+e[0]*rs,y+e[1]*rs,20+rs*8,[150,255,90],.8);
      glow(g,x,y+rs*6,30+rs*14,[255,200,120],.45);
    }
    // receding glint
    if(f>.6){const a=ss(.6,.95,f)*(1-ss(.98,1,f)*.3);flare(g,x,y,80+60*Math.sin(u*2)*.2,a*.9);glow(g,x,y,60,[255,240,200],a)}
    // launch ring at the canopy
    if(u>L8&&u<2.6){const t=(u-L8)/2.3;windRing(g,700-60+sx,2410-camY+sy,eOut(t,2)*1300,1-t,13,16)}
    for(const l of st.Lf){const lit=Math.abs((l.x-900)+(l.y-200)*.9)<160;drawLeaf(g,l.x,l.y,l.sz,l.rot,l.flip,lit?'#ffd977':l.c[0],l.c[1],true)}
    // end card
    const ta=ss(7.2,8.6,u);if(ta>0){g.save();g.globalAlpha=ta;const bg=g.createLinearGradient(0,H*.6,0,H);bg.addColorStop(0,'rgba(30,26,60,0)');bg.addColorStop(1,'rgba(30,26,60,.4)');g.fillStyle=bg;g.fillRect(0,H*.6,W,H*.4);
      g.textAlign='center';g.fillStyle='#fff6e4';g.shadowColor='rgba(60,30,40,.55)';g.shadowBlur=14;
      g.font='500 54px Georgia,"Times New Roman",serif';g.letterSpacing='14px';g.fillText('THE TWELFTH AWAKENS',W/2+7,H*.8);
      g.font='22px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';g.letterSpacing='10px';g.fillStyle='#d9f0b0';g.fillText('十二の目覚め',W/2+5,H*.86);
      g.font='13px Georgia,serif';g.letterSpacing='6px';g.fillStyle='rgba(255,240,215,.8)';g.fillText('SEATTLE · SUNRISE · GAME DAY',W/2+3,H*.91);g.restore()}
  }});
function robScale(f){return 3.6*Math.pow(.05,f)}

let START=[],TOTAL=0;SHOTS.forEach(s=>{START.push(TOTAL);TOTAL+=s.d});
// =====================================================================
//  RENDER LOOP — 24 fps, shots simulated deterministically
// =====================================================================
let cur=-1,st={},simU=0;
function render(T){
  T=Math.floor(T*24+1e-6)/24;
  let i=0;while(i<SHOTS.length-1&&T>=START[i+1])i++;
  const sh=SHOTS[i],u=Math.min(sh.d,T-START[i]);
  if(i!==cur||u<simU-1e-6){cur=i;st={};sh.init(st);simU=0}
  while(simU+1/24<=u+1e-6){simU+=1/24;sh.step(st,simU,1/24)}
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  sh.draw(ctx,u,st);
  ctx.setTransform(1,0,0,1,0,0);
  // finishing: grain + vignette + warm grade
  ctx.globalCompositeOperation='soft-light';ctx.globalAlpha=.08;ctx.drawImage(GRAIN,0,0);ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';ctx.drawImage(VIG,0,0);
  ctx.globalCompositeOperation='soft-light';ctx.fillStyle='rgba(255,200,140,.12)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  // fades
  let fa=0;if(T<1.4)fa=1-T/1.4;if(T>TOTAL-.8)fa=(T-(TOTAL-.8))/.8;
  // brief flash on the ring
  const s7=START[6];if(T>s7+1&&T<s7+1.25){ctx.fillStyle=`rgba(255,246,220,${(1-(T-s7-1)/.25)*.5})`;ctx.fillRect(0,0,W,H)}
  const s8=START[7];if(T>s8+L8&&T<s8+L8+.12){ctx.fillStyle='rgba(255,250,230,.55)';ctx.fillRect(0,0,W,H)}
  if(fa>0){ctx.fillStyle=`rgba(0,0,0,${clamp(fa,0,1)})`;ctx.fillRect(0,0,W,H)}
}

const params=new URLSearchParams(location.search);
let playing=true,T=0,last=null,lastFrame=-1;
function loop(now){
  if(last===null)last=now;const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){T+=dt;if(T>TOTAL+1.2)T=0}
  const fr=Math.floor(T*24);if(fr!==lastFrame){lastFrame=fr;render(Math.min(T,TOTAL-1e-3))}
  requestAnimationFrame(loop);
}
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'PAUSE':'PLAY'};
document.getElementById('replay').onclick=()=>{T=0;playing=true;document.getElementById('play').textContent='PAUSE'};
cv.onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'PAUSE':'PLAY'};
window.__render=t=>{render(t)};window.__total=()=>TOTAL;
setTimeout(()=>{prerender();document.getElementById('load').remove();
  if(params.has('t')){document.getElementById('hud').remove();playing=false;T=parseFloat(params.get('t'));render(T)}
  window.__ready=true;requestAnimationFrame(loop)},30);
})();
