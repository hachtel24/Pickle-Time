<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Chronoglobe</title>
<style>
@font-face{font-family:Monocraft;src:url(data:font/ttf;base64,__FONT__) format("truetype")}
:root{--bg0:#2a3246;--bg1:#151a26;--ink:#f1efe8;--dim:rgba(241,239,232,.55);--panel:rgba(8,10,16,.72)}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,var(--bg0) 0%,var(--bg1) 70%);font-family:Monocraft,ui-monospace,monospace;color:var(--ink)}
canvas{display:block}
#year{position:fixed;top:22px;left:28px;font-size:46px;letter-spacing:2px;text-shadow:0 3px 0 rgba(0,0,0,.45)}
#era{position:fixed;top:78px;left:30px;font-size:13px;color:var(--dim);letter-spacing:1px}
#cap{position:fixed;left:24px;bottom:84px;max-width:min(980px,calc(100vw - 48px));font-size:clamp(14px,1.9vw,24px);line-height:1.45}
#cap .prev{color:rgba(241,239,232,.45);background:rgba(8,10,16,.45);padding:2px 6px;display:inline-block;margin-bottom:4px}
#cap .cur{background:var(--panel);padding:4px 8px;display:inline-block;white-space:pre-wrap}
#credits{position:fixed;left:50%;top:15%;transform:translateX(-50%);background:var(--panel);padding:18px 34px;text-align:center;font-size:clamp(11px,1.45vw,19px);line-height:2.1;color:rgba(241,239,232,.78);transition:opacity 1.2s;white-space:nowrap}
#credits b{color:#fff;font-weight:normal}
#labels{position:fixed;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.7),0 0 6px rgba(0,0,0,.6);transition:opacity .4s;letter-spacing:.5px}
#bar{position:fixed;left:24px;right:24px;bottom:20px;display:flex;gap:12px;align-items:center;opacity:.25;transition:opacity .3s}
#bar:hover,body.paused #bar{opacity:1}
#bar button{font:13px Monocraft,monospace;background:var(--panel);color:var(--ink);border:1px solid rgba(255,255,255,.25);padding:6px 12px;cursor:pointer}
#scrub{flex:1;accent-color:#9fd36a}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:3px;color:var(--dim)}
body.rec #bar{display:none}
canvas{touch-action:none}
:root{color-scheme:dark}
#cap{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#bar{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){
 #year{font-size:30px;top:calc(14px + env(safe-area-inset-top,0px));left:16px}
 #era{top:calc(52px + env(safe-area-inset-top,0px));left:17px;font-size:11px}
 #credits{white-space:normal;width:calc(100vw - 48px);padding:12px 14px;line-height:1.7;top:18%}

 .lab{font-size:10px!important}
}

#fade{position:fixed;inset:0;background:#1a2030;opacity:0;pointer-events:none}
#datebox{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:22px;background:rgba(14,10,30,.88);border:3px solid #3a2f6e;padding:10px 18px 12px;display:none;min-width:220px}
#datebox .d{font-size:46px;color:#fff04a;text-shadow:3px 3px 0 #6b5a12;letter-spacing:1px;margin-bottom:6px;white-space:nowrap}
#datebox .lg{font-size:14px;display:flex;align-items:center;gap:8px;line-height:1.75}
#datebox .lg i{width:13px;height:13px;display:inline-block}
#place{position:fixed;transform:translate(-50%,-100%);background:rgba(10,8,20,.72);color:#fff04a;padding:3px 10px;font-size:22px;white-space:nowrap;display:none;pointer-events:none}
body.indio #datebox,body.indio #place{display:block}
body.indio #year,body.indio #era{display:none}
#cap em{font-style:normal;color:#f0a830}
#cap .prev em{color:rgba(240,168,48,.55)}
#chapbar{position:fixed;left:24px;right:24px;bottom:calc(58px + env(safe-area-inset-bottom,0px));font-size:12px;color:rgba(241,239,232,.8);pointer-events:none}
#chapbar .row{display:flex;justify-content:space-between;margin-bottom:5px}
#chapbar .track{display:flex;gap:3px;height:6px}
#chapbar .track i{background:rgba(255,255,255,.18);position:relative;overflow:hidden}
#chapbar .track b{position:absolute;inset:0 auto 0 0;background:#c8382f;width:0}
#cap{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
body.rec #chapbar{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
body.rec #cap{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
@media (max-width:760px){#datebox{left:12px;padding:6px 10px;min-width:0}#datebox .d{font-size:26px}#datebox .lg{font-size:11px}#place{font-size:14px}#chapbar{left:12px;right:12px;font-size:10px;bottom:calc(52px + env(safe-area-inset-bottom,0px))}#cap{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}

.tlab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;background:rgba(12,10,22,.62);padding:2px 8px;transition:opacity .4s}
.tlab.country{font-size:20px;color:#fff;border-bottom:3px solid rgba(255,255,255,.85);letter-spacing:1px}
.tlab.city{font-size:15px;color:#e6e2d6;border-top:3px solid #e8b84a}
body.theater #datebox{display:block}
body.theater #year,body.theater #era{display:none}
@media (max-width:760px){.tlab.country{font-size:13px}.tlab.city{font-size:11px}}
</style>

function buildSite(key){

 let rz=null;if(S.river){rz=new Float32Array(G);let prevJ=-1;for(let i=0;i<G;i++){let best=1e9,bj=0;for(let j=20;j<G-20;j++){const pen=prevJ<0?0:Math.abs(j-prevJ)*6;const v=E[idx(i,j)]+pen;if(v<best){best=v;bj=j}}prevJ=bj;rz[i]=bj}
   for(let p=0;p<3;p++)for(let i=1;i<G-1;i++)rz[i]=(rz[i-1]+rz[i]*2+rz[i+1])/4;
   for(let i=0;i<G;i++){const j0=Math.round(rz[i]);for(let j=j0-1;j<=j0+1;j++)if(j>=0&&j<G){isW[idx(i,j)]=1;Hh[idx(i,j)]=0}}}

 const ci=x=>Math.max(0,Math.min(G-1,Math.floor(x+half))),toX=i=>i-half+.5;

 props.instanceMatrix.needsUpdate=tTop.instanceMatrix.needsUpdate=tBody.instanceMatrix.needsUpdate=dio.dirty;if(dio.dirty){props.instanceColor.needsUpdate=tTop.instanceColor.needsUpdate=tBody.instanceColor.needsUpdate=true;dio.dirty=false}
 // camera: slow orbit and push-in, framed per site
 const k=u/S.dur,yaw=S.yaw+(k-.5)*.3,pit=S.pitch-.05*k,dist=S.dist*(1.08-.14*k)*Math.max(1,1.25/dio.cam.aspect);
 const t=S.target;dio.cam.position.set(t[0]+Math.sin(yaw)*Math.cos(pit)*dist,t[1]+Math.sin(pit)*dist,t[2]+Math.cos(yaw)*Math.cos(pit)*dist);dio.cam.lookAt(t[0],t[1],t[2]);
}

// ---------------- the tour: [year, lat, lon, caption, battlefield?]

 [1941,53,32,"Germany invades the Soviet Union with more than three million troops.",null,{date:'JUN 1941',dist:320,labels:[['SOVIET UNION',57,42,1],['GERMANY',50.2,9.6,1],['Moscow',55.75,37.62],['Leningrad',59.94,30.31],['Kyiv',50.45,30.52]]}],
 [1941,28,171,"Japan attacks Pearl Harbor. The United States enters the war.",null,{date:'DEC 1941',dist:360,labels:[['JAPAN',37,138,1],['Tokyo',35.68,139.69],['Pearl Harbor',21.36,-157.95]]}],

 [1943,49,44,"At Stalingrad the German Sixth Army surrenders. The tide turns in the east.",null,{date:'FEB 1943',dist:300,labels:[['SOVIET UNION',56,48,1],['Stalingrad',48.71,44.51],['Moscow',55.75,37.62],['Rostov',47.24,39.71]]}],
 [1944,49.36,-0.86,"The Allies open a second front in Western Europe.","normandy",{date:'JUN 1944',dist:280,labels:[['FRANCE',46.6,2.5,1],['BRITAIN',53,-1.6,1],['GERMANY',50.2,9.6,1],['London',51.51,-.13],['Paris',48.86,2.35]]}],

const HOLD=4.2,MOVE=3.0,DIVE=1.8,RISE=1.8;
const SEGS=[];let ACC=0;const pushSeg=o=>{o.t0=ACC;ACC+=o.d;SEGS.push(o)};
TOUR.forEach((s,i)=>{if(i>0)pushSeg({k:'move',i,d:MOVE});pushSeg({k:'hold',i,d:HOLD});if(s[4]){pushSeg({k:'dive',i,d:DIVE});pushSeg({k:'dio',i,d:SITES[s[4]].dur});pushSeg({k:'rise',i,d:RISE})}});
const TOTAL=ACC+4;
function tourAt(t){let j=0;for(let q=0;q<SEGS.length;q++)if(SEGS[q].t0<=t)j=q;const sg=SEGS[j],u=Math.min(t-sg.t0,sg.d),b=TOUR[sg.i];
  const dOf=x=>(x[5]&&x[5].dist)||camDist;const base={i:sg.i,seg:sg,year:b[0],lat:b[1],lon:b[2],ci:sg.i,cu:99,mode:'globe',f:0,dist:dOf(b)};
  if(sg.k==='move'){const a=TOUR[sg.i-1];let f=u/MOVE;f=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;let dl=b[2]-a[2];if(dl>180)dl-=360;if(dl<-180)dl+=360;
    return{...base,ci:sg.i-1,year:a[0]+(b[0]-a[0])*f,lat:a[1]+(b[1]-a[1])*f,lon:a[2]+dl*f,dist:dOf(a)+(dOf(b)-dOf(a))*f}}
  if(sg.k==='hold')return{...base,cu:u};
  if(sg.k==='dive')return{...base,mode:'dive',f:u/DIVE};
  if(sg.k==='rise')return{...base,mode:'rise',f:u/RISE};
  return{...base,mode:'dio',site:b[4],u}}
// chapters (shown in the progress bar)
const CHAP=[[-1e9,'First Empires'],[-600,'The Classical World'],[500,'Faith and Conquest'],[1450,'Gunpowder and Sail'],[1780,'Revolutions and Empires'],[1914,'The World Wars'],[1946,'The Modern World']];
const chapOf=y=>{let c=0;CHAP.forEach((x,k)=>{if(y>=x[0])c=k});return c};
const chapSpan=CHAP.map(()=>[1e9,-1e9]);SEGS.forEach(sg=>{const c=chapOf(TOUR[sg.i][0]);chapSpan[c][0]=Math.min(chapSpan[c][0],sg.t0);chapSpan[c][1]=Math.max(chapSpan[c][1],sg.t0+sg.d)});
chapSpan[chapSpan.length-1][1]=TOTAL;
const chapEl=document.getElementById('chapbar');
chapEl.innerHTML='<div class="row"><span id="chapname"></span><span id="chapleft"></span></div><div class="track">'+chapSpan.map(([a,b])=>`<i style="flex:${b-a}"><b></b></i>`).join('')+'</div>';
const chapFills=[...chapEl.querySelectorAll('.track b')];
function updChap(){const c=chapOf(TOUR[tourAt(Math.min(T,TOTAL-.01)).i][0]);document.getElementById('chapname').textContent=`Chapter ${c+1} of ${CHAP.length} · ${CHAP[c][1]}`;
  const left=Math.max(0,TOTAL-T);document.getElementById('chapleft').textContent=`${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')} left`;
  chapFills.forEach((b,k)=>{const[a,e]=chapSpan[k];b.style.width=Math.max(0,Math.min(1,(T-a)/(e-a)))*100+'%'})}

// ---------------- UI
const yEl=document.getElementById('year'),eraEl=document.getElementById('era'),capEl=document.getElementById('cap'),credEl=document.getElementById('credits');
const dateEl=document.getElementById('datebox'),placeEl=document.getElementById('place'),fadeEl=document.getElementById('fade');
const fmtY=y=>{y=Math.round(y);return y<=0?`${-y+(y===0?1:0)} BCE`:`${y} CE`};
const eraName=y=>y<-1200?'Bronze Age':y<-500?'Iron Age':y<500?'Classical Antiquity':y<1500?'Middle Ages':y<1800?'Early Modern':y<1945?'Age of Empires & Revolutions':'Contemporary';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function setCap(prevHtml,cur,u){const n=Math.floor(Math.max(0,u-.3)*42);
  capEl.innerHTML=(prevHtml?`<span class="prev">${prevHtml}</span><br>`:'')+`<span class="cur"></span>`;
  const el=capEl.querySelector('.cur');if(typeof cur==='string')el.textContent=cur.slice(0,n)+(n<cur.length&&Math.floor(u*4)%2?'_':'');
  else{const full=cur[1];el.innerHTML=`<em>[${esc(cur[0])}]</em> `+esc(full.slice(0,n))+(n<full.length&&Math.floor(u*4)%2?'_':'')}}
const capOf=x=>x[5]&&x[5].date?[x[5].date,x[3]]:x[3];
const capHtml=x=>x[5]&&x[5].date?`<em>[${esc(x[5].date)}]</em> ${esc(x[3])}`:esc(x[3]);
function updCaption(i,u){setCap(i>0?capHtml(TOUR[i-1]):'',capOf(TOUR[i]),u)}
const LEGEND=[['Allies','#a9c4ff'],['Axis','#d63a2f'],['Vichy France','#c9ad78'],['Neutral','#6c9b3b']];
function theaterBox(date){if(dateEl._k===date)return;dateEl._k=date;dateEl.innerHTML=`<div class="d">${esc(date)}</div>`+LEGEND.map(t=>`<div class="lg"><i style="background:${t[1]}"></i>${t[0]}</div>`).join('')}
// theater labels: countries and cities from latitude/longitude
const tEl=document.createElement('div');tEl.id='tlabels';document.body.appendChild(tEl);let tKey=null,tPool=[];
const llVec=(la,lo,r)=>{const p=(90-la)*Math.PI/180,l=lo*Math.PI/180;return new THREE.Vector3(Math.sin(p)*Math.cos(l)*r,Math.cos(p)*r,-Math.sin(p)*Math.sin(l)*r)};
function theaterLabels(list,key){if(tKey!==key){tKey=key;tEl.innerHTML='';tPool=(list||[]).map(l=>{const e=document.createElement('div');e.className='tlab '+(l[3]?'country':'city');e.textContent=l[0];tEl.appendChild(e);e._v=llVec(l[1],l[2],R+(l[3]?13:8)*unit);return e})}
  tPool.forEach(e=>{W3.copy(e._v).applyMatrix4(globe.matrixWorld);CN.copy(W3).normalize();const face=CN.dot(camera.position.clone().normalize());W3.project(camera);
    e._x=(W3.x*.5+.5)*innerWidth;e._y=(-W3.y*.5+.5)*innerHeight;e.style.opacity=face>.3?Math.min(1,(face-.3)*5):0});
  // nudge colliding tags apart vertically
  const placed=[];tPool.forEach(e=>{const w=(e.offsetWidth||80)/2+6;let y=e._y;for(let pass=0;pass<4;pass++){let hit=false;for(const p of placed)if(Math.abs(p[0]-e._x)<w+p[2]&&Math.abs(p[1]-y)<30){y=p[1]+(y>=p[1]?32:-32);hit=true}if(!hit)break}
    placed.push([e._x,y,w]);e.style.left=e._x+'px';e.style.top=y+'px'})}
function dioCaption(S,u){let c=0;S.caps.forEach((x,k)=>{if(u>=x[0])c=k});const cur=S.caps[c],prev=c>0?S.caps[c-1]:null;
  setCap(prev?`<em>[${esc(prev[1])}]</em> ${esc(prev[2])}`:'',[cur[1],cur[2]],u-cur[0]);
  const key=S.title+c;if(dateEl._k!==key){dateEl._k=key;
    dateEl.innerHTML=`<div class="d">${esc(cur[1].replace(/^\d+ /,''))}</div>`+S.teams.map(t=>`<div class="lg"><i style="background:${t.T}"></i>${esc(t.name)}</div>`).join('')+(S.legendExtra||[]).map(t=>`<div class="lg"><i style="background:${t[1]}"></i>${esc(t[0])}</div>`).join('')}}

// interaction: drag to look around, wheel to zoom
let drag=null,userYaw=0,userPitch=0,idle=99;
addEventListener('pointerdown',e=>{if(e.target.closest('#bar'))return;drag=[e.clientX,e.clientY]});
addEventListener('pointermove',e=>{if(!drag)return;userYaw+=(e.clientX-drag[0])*.005;userPitch=Math.max(-1.2,Math.min(1.2,userPitch+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];idle=0});
addEventListener('pointerup',()=>drag=null);
addEventListener('wheel',e=>{camDist=Math.max(260,Math.min(900,camDist*(1+e.deltaY*.001)))},{passive:true});
let playing=!params.has('t'),T=parseFloat(params.get('t')||0);
const pp=document.getElementById('pp'),scrub=document.getElementById('scrub');
const setPlay=p=>{playing=p;pp.textContent=p?'PAUSE':'PLAY';document.body.classList.toggle('paused',!p)};
pp.onclick=()=>setPlay(!playing);document.getElementById('restart').onclick=()=>{T=0;setPlay(true)};
scrub.oninput=()=>{T=scrub.value/1000*TOTAL};
addEventListener('keydown',e=>{if(e.code==='Space'){setPlay(!playing);e.preventDefault()}});
addEventListener('resize',()=>{camera.aspect=dio.cam.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();dio.cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

let rotX=0,rotY=0,lastLabK=-1,prev=performance.now();const PV=new THREE.Vector3();
function render(now,dtOverride){const dt=dtOverride??Math.min(.1,(now-prev)/1000);prev=now;const still=dtOverride!==undefined;
  if(playing){T+=dt;if(T>TOTAL)T=0}idle+=dt;scrub.value=T/TOTAL*1000;
  const s=tourAt(Math.min(T,TOTAL-.001));
  document.body.classList.toggle('indio',s.mode==='dio');
  updChap();
  credEl.style.transition=still?'none':'';credEl.style.opacity=(T<6||T>TOTAL-4)?1:0;
  if(s.mode==='dio'){const S=SITES[s.site];ensureSite(s.site);updateDio(s.u);
    fadeEl.style.opacity=Math.max(1-s.u/.45,ssf(S.dur-.45,S.dur,s.u));
    dioCaption(S,s.u);labEl.style.opacity=0;
    renderer.render(dio.scene,dio.cam);
    const L=dio.site.label;PV.set(L[0],dio.site.ground(L[0],L[1])+4,L[1]).project(dio.cam);
    tEl.style.opacity=0;placeEl.textContent=S.title;placeEl.style.left=(PV.x*.5+.5)*innerWidth+'px';placeEl.style.top=(-PV.y*.5+.5)*innerHeight+'px';
    return}
  // globe modes
  const opt=TOUR[s.ci][5],th=s.mode==='globe'&&opt&&opt.date;document.body.classList.toggle('theater',!!th);if(th)theaterBox(opt.date);
  labEl.style.opacity=s.mode==='globe'&&!(opt&&opt.labels)?1:0;tEl.style.opacity=s.mode==='globe'&&opt&&opt.labels?1:0;
  let k=0;for(let j=0;j<YEARS.length;j++)if(YEARS[j]<=s.year+1e-6)k=j;
  const al=s.year>=1938.99&&s.year<=1945.01;setKey(k,still,al);stepRecolor();if(still)while(pend)stepRecolor();
  if(k!==lastLabK){updLabels(k);lastLabK=k}
  if(idle>4||s.mode!=='globe'){userYaw*=.9;userPitch*=.9}
  // dive/rise: zoom straight onto the battlefield, fading through the night-blue background
  const z=s.mode==='dive'?Math.pow(s.f,2.2):s.mode==='rise'?Math.pow(1-s.f,2.2):0;
  const tx=(s.lat-6*(1-z))*Math.PI/180,ty=-(s.lon*Math.PI/180)-Math.PI/2;
  let dy=ty-rotY;dy=Math.atan2(Math.sin(dy),Math.cos(dy));
  const kk=still||s.mode!=='globe'?1:Math.min(1,dt*2.2);rotY+=dy*kk;rotX+=(tx-rotX)*kk;
  globe.rotation.set(rotX+userPitch,rotY+userYaw,0,'XYZ');
  cloudG.rotation.y=T*.012;cloudG.visible=z<.5&&!document.body.classList.contains('theater');
  const targetZ=s.dist+(122-s.dist)*z;camera.position.z=s.mode==='globe'&&!still?camera.position.z+(targetZ-camera.position.z)*.1:targetZ;
  fadeEl.style.opacity=s.mode==='dive'?ssf(.55,1,s.f):s.mode==='rise'?1-ssf(0,.45,s.f):0;
  yEl.textContent=fmtY(s.year);eraEl.textContent=eraName(s.year).toUpperCase();
  if(s.mode==='globe')updCaption(s.ci,s.cu);else updCaption(s.i,99);
  renderer.render(scene,camera);placeLabels();theaterLabels(opt&&opt.labels,s.ci)}
document.getElementById('load').remove();
window.__seek=t=>{T=t;render(performance.now(),0);render(performance.now(),0)};window.__total=TOTAL;window.__ready=true;
window.__segs=SEGS.map(s=>[s.k,TOUR[s.i][0],+s.t0.toFixed(1)]);
if(params.has('t')){setPlay(false);window.__seek(T)}
if(!params.has('t'))(function loop(now){render(now);requestAnimationFrame(loop)})(performance.now());
})();
